<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Screen by Shardapps — less glare, a smaller footprint</title>
  <desc id="desc">An illustrated Windows desktop with Screen's compact brightness slider above the bottom-right taskbar. Alt+S opens the panel. Native C++20, multi-monitor dimming, no telemetry.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101125"/><stop offset="1" stop-color="#28234c"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#b5adff"/><stop offset="1" stop-color="#75d7e5"/></linearGradient>
    <linearGradient id="desktop" x2="1" y2="1"><stop stop-color="#34304c"/><stop offset="1" stop-color="#171923"/></linearGradient>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1100" cy="90" r="280" fill="#8f83f4" opacity=".055"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="72" y="72" width="56" height="56" rx="17" fill="#7563dd"/>
    <path d="M108 84a19 19 0 1 0 5 30 18 18 0 0 1-5-30" fill="#fffaeb"/>
    <text x="146" y="108" font-size="17" fill="#c6c0e0" letter-spacing="3">SHARDAPPS</text>
    <text x="68" y="230" font-size="84" font-weight="650" fill="#fff">Screen.</text>
    <text x="73" y="298" font-size="40" fill="url(#accent)">Less glare.</text>
    <text x="73" y="351" font-size="40" fill="url(#accent)">More room to focus.</text>
    <text x="75" y="410" font-size="19" fill="#bbb6d2">A lightweight overlay screen dimmer</text>
    <text x="75" y="440" font-size="19" fill="#bbb6d2">for Windows 11. Native. Quiet. Yours.</text>
    <g font-size="14" fill="#dedaf1">
      <rect x="75" y="490" width="116" height="35" rx="17" fill="#ffffff" fill-opacity=".07"/><text x="94" y="513">C++20 / Win32</text>
      <rect x="202" y="490" width="130" height="35" rx="17" fill="#ffffff" fill-opacity=".07"/><text x="223" y="513">Multi-monitor</text>
      <rect x="343" y="490" width="128" height="35" rx="17" fill="#ffffff" fill-opacity=".07"/><text x="361" y="513">Apache 2.0</text>
    </g>
    <text x="75" y="583" font-size="13" fill="#928ba9">Open source · No account · No telemetry · No administrator prompt</text>
    <text x="707" y="105" font-size="12" fill="#b6afd4" letter-spacing="2">ONE SHORTCUT. ONE SMALL SLIDER.</text>
    <rect x="693" y="139" width="522" height="363" rx="19" fill="#060612" opacity=".35"/>
    <rect x="687" y="131" width="522" height="363" rx="19" fill="url(#desktop)" stroke="#514765"/>
    <path d="M710 363Q825 130 1040 290T1190 206" fill="none" stroke="#8c77cc" stroke-opacity=".12" stroke-width="60"/>
    <rect x="687" y="444" width="522" height="50" rx="12" fill="#2d2c3b"/>
    <rect x="893" y="459" width="18" height="18" rx="3" fill="#8a82c8"/>
    <rect x="925" y="459" width="18" height="18" rx="5" fill="#847cac"/>
    <rect x="957" y="459" width="18" height="18" rx="5" fill="#b1a3ea"/>
    <text x="1190" y="464" text-anchor="end" font-size="12" fill="#ddd7ed">9:41</text>
    <text x="1190" y="481" text-anchor="end" font-size="10" fill="#9f99b1">Windows 11</text>
    <rect x="855" y="295" width="330" height="136" rx="16" fill="#000" opacity=".2"/>
    <rect x="849" y="289" width="330" height="136" rx="14" fill="#242429" stroke="#47414f"/>
    <circle cx="879" cy="320" r="6" fill="none" stroke="#b7a4ff" stroke-width="2"/>
    <path d="M879 307v3m0 20v3m-13-13h3m20 0h3m-22-9 3 3m12 12 3 3m0-18-3 3m-12 12-3 3" stroke="#b7a4ff" stroke-width="1.5"/>
    <text x="898" y="326" font-size="14" font-weight="600" fill="#f4f2fa">Brightness</text>
    <text x="1155" y="328" text-anchor="end" font-size="22" fill="#f4f2fa">70%</text>
    <rect x="873" y="360" width="282" height="5" rx="2.5" fill="#4b4756"/>
    <rect x="873" y="360" width="190" height="5" rx="2.5" fill="#b7a4ff"/>
    <circle cx="1063" cy="362" r="8" fill="#b7a4ff"/>
    <text x="873" y="405" font-size="11" fill="#ada9bb">All displays</text>
    <text x="1155" y="405" text-anchor="end" font-size="11" fill="#ada9bb">Alt + S</text>
    <text x="948" y="543" text-anchor="middle" font-size="17" fill="#c7bfdf">Deeper dimming. Smoother control.</text>
    <text x="948" y="574" text-anchor="middle" font-size="12" fill="#928ba9">Interface illustration · Actual app screenshot in README</text>
  </g>
</svg>
